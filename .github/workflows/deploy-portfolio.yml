name: Deploy MATUDI Official Portfolio

on:
  push:
    branches: [main]
    paths:
      - "projects/matudi-official-portfolio/working/**"
      - ".github/workflows/deploy-portfolio.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "matudi-portfolio-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload portfolio site
        uses: actions/upload-pages-artifact@v3
        with:
          path: projects/matudi-official-portfolio/working
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
