name: Chess Lab browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "projects/chess-lab/**"
      - "vercel.json"
      - "scripts/serve-chess-lab.mjs"
      - "scripts/smoke-chess-lab.mjs"
      - ".github/workflows/chess-browser-smoke.yml"

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Chess Lab browser tests
        run: |
          node scripts/serve-chess-lab.mjs >/tmp/chess-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke-chess-lab.mjs
