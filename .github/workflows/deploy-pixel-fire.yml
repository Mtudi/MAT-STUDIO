name: Deploy Pixel Fire to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "projects/pixel-fire/**"
      - "projects/pixel-fire-original/**"
      - "projects/pixel-fire-studio/**"
      - ".github/workflows/deploy-pixel-fire.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pixel-fire-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site/projects/pixel-fire _site/projects/pixel-fire-original _site/projects/pixel-fire-studio
          cp projects/pixel-fire/index.html projects/pixel-fire/style.css projects/pixel-fire/script.js _site/projects/pixel-fire/
          cp projects/pixel-fire-original/index.html projects/pixel-fire-original/style.css projects/pixel-fire-original/script.js _site/projects/pixel-fire-original/
          cp projects/pixel-fire-studio/index.html projects/pixel-fire-studio/style.css projects/pixel-fire-studio/script.js _site/projects/pixel-fire-studio/
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=projects/pixel-fire-studio/"><title>Pixel Fire Studio</title></head>
          <body><a href="projects/pixel-fire-studio/">Open Pixel Fire Studio</a></body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
