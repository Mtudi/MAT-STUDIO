name: MATSONG browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "projects/matsong/**"
      - "scripts/smoke-matsong.mjs"
      - ".github/workflows/matsong-browser-smoke.yml"

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run MATSONG browser tests
        run: node scripts/smoke-matsong.mjs
