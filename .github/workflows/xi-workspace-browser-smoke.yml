name: Xi Workspace browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "projects/ai-workspace/**"
      - "api/chat.js"
      - "api/supabase-config.js"
      - "scripts/smoke-xi-workspace.mjs"
      - ".github/workflows/xi-workspace-browser-smoke.yml"

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Xi Workspace browser tests
        run: node scripts/smoke-xi-workspace.mjs
