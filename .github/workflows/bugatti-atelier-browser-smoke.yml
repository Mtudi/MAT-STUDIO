name: Bugatti Atelier Browser Smoke
on:
  push:
    branches: [main]
    paths:
      - 'projects/bugatti-atelier/**'
      - 'scripts/smoke-bugatti-atelier.mjs'
      - '.github/workflows/bugatti-atelier-browser-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'projects/bugatti-atelier/**'
      - 'scripts/smoke-bugatti-atelier.mjs'
      - '.github/workflows/bugatti-atelier-browser-smoke.yml'
  workflow_dispatch:

concurrency:
  group: bugatti-atelier-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Playwright package
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory projects/bugatti-atelier >/tmp/bugatti-server.log 2>&1 &
          echo $! >/tmp/bugatti-server.pid
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bugatti-server.log
          exit 1
      - name: Run browser smoke tests
        run: node scripts/smoke-bugatti-atelier.mjs
