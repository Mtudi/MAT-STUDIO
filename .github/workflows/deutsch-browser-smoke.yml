name: Deutsch browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "projects/deutsch/**"
      - "scripts/smoke-deutsch.mjs"
      - ".github/workflows/deutsch-browser-smoke.yml"

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Deutsch browser tests
        run: |
          python3 -m http.server 4173 --directory projects/deutsch >/tmp/deutsch-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke-deutsch.mjs
