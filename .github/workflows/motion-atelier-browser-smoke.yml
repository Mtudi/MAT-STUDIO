name: Motion Atelier browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "projects/motion-atelier/**"
      - "scripts/serve-motion-atelier.mjs"
      - "scripts/smoke-motion-atelier.mjs"
      - ".github/workflows/motion-atelier-browser-smoke.yml"

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Motion Atelier browser tests
        run: |
          node scripts/serve-motion-atelier.mjs >/tmp/motion-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4175/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke-motion-atelier.mjs
