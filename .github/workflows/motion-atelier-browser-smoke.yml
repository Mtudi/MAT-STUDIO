name: Motion Atelier browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "Motion Atelier 3D Studio.html"
      - "scripts/smoke-motion-atelier.mjs"
      - ".github/workflows/motion-atelier-browser-smoke.yml"

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Motion Atelier browser tests
        run: node scripts/smoke-motion-atelier.mjs
