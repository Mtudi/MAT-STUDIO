<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#050505">
<title>Pixel Fire</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#050505;color:#f5eee8}
body{min-height:100svh;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(100%,1100px);padding:24px 16px;text-align:center}
h1{margin:0 0 8px;font-size:clamp(22px,4vw,34px);font-weight:750;letter-spacing:.12em}
p{margin:0 0 24px;color:#8f8278;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#030303;image-rendering:pixelated;image-rendering:crisp-edges}
@media(max-width:600px){main{padding:16px 10px}p{font-size:10px;margin-bottom:18px}}
</style>
</head>
<body><main>
<h1>🔥 PIXEL FIRE</h1><p>Automatic flame simulation</p>
<canvas id="fire" width="160" height="90" role="img" aria-label="Pixel fire that automatically rises and falls"></canvas>
</main>
<script>
(()=>{
const canvas=document.getElementById('fire'),ctx=canvas.getContext('2d',{alpha:false});
const W=160,H=90,heat=new Uint8Array(W*H),off=document.createElement('canvas');off.width=W;off.height=H;
const fx=off.getContext('2d',{alpha:false});
const colors=['#030303','#100504','#210704','#330904','#470b03','#5b0e03','#701202','#861803','#9b2004','#b12a05','#c73505','#d94305','#ec5105','#fa6108','#ff710b','#ff8010','#ff9017','#ffa020','#ffb02b','#ffbf3b','#ffcd50','#ffda69','#ffe583','#ffed9f','#fff5c5','#fffbe8','#ffffff'];
let t=0,last=0,acc=0;
function update(){
 const next=new Uint8Array(W*H);
 const breath=.78+.22*(.5+.5*Math.sin(t*.018));
 for(let x=0;x<W;x++){
  const lick=Math.pow(Math.max(0,Math.sin(x*.115+t*.035)),7)*2.2;
  next[(H-1)*W+x]=Math.min(26,Math.round(24*breath+Math.random()*2+lick));
  if(Math.random()<.16)next[(H-2)*W+x]=Math.max(next[(H-2)*W+x],23);
 }
 for(let y=0;y<H-1;y++)for(let x=0;x<W;x++){
  const source=(y+1)*W+x, drift=Math.random()<.5?-1:1;
  const nx=Math.max(0,Math.min(W-1,x+drift));
  const topFade=y<12?(12-y)*.012:0;
  const decay=.16+Math.random()*.22+topFade;
  const value=Math.max(0,heat[source]-decay);
  const target=y*W+nx;
  if(value>next[target])next[target]=Math.round(value);
 }
 heat.set(next);t++;
}
function draw(){
 const image=fx.createImageData(W,H),d=image.data;
 for(let i=0;i<heat.length;i++){
  const n=parseInt(colors[Math.min(26,heat[i])].slice(1),16),j=i*4;
  d[j]=(n>>16)&255;d[j+1]=(n>>8)&255;d[j+2]=n&255;d[j+3]=255;
 }
 fx.putImageData(image,0,0);
 // Scale the same living flame up and down so the change in flame height is unmistakable.
 const wave=.5+.5*Math.sin(t*.009);
 const flameHeight=38+50*wave;
 ctx.fillStyle='#030303';ctx.fillRect(0,0,W,H);
 ctx.imageSmoothingEnabled=false;
 ctx.drawImage(off,0,0,W,H,0,H-flameHeight,W,flameHeight);
}
function loop(now){
 requestAnimationFrame(loop);
 if(!last)last=now;
 acc+=Math.min(100,now-last);last=now;
 while(acc>=30){update();acc-=30}
 draw();
}
for(let i=0;i<90;i++)update();draw();requestAnimationFrame(loop);
})();
</script></body></html>
