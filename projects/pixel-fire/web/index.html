<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<title>Pixel Fire</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#050505;color:#f5eee8}
body{min-height:100svh;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(100%,1100px);padding:24px 16px;text-align:center}
h1{margin:0 0 8px;font-size:clamp(22px,4vw,34px);font-weight:750;letter-spacing:.12em}
p{margin:0 0 24px;color:#8f8278;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#030303;image-rendering:pixelated;image-rendering:crisp-edges}
@media(max-width:600px){main{padding:16px 10px}p{font-size:10px;margin-bottom:18px}}
@media(prefers-reduced-motion:reduce){canvas{image-rendering:pixelated}}
</style>
</head>
<body>
<main>
<h1>🔥 PIXEL FIRE</h1>
<p>Automatic flame simulation</p>
<canvas id="fire" width="160" height="90" role="img" aria-label="Pixel fire that automatically rises and falls"></canvas>
</main>
<script>
(()=>{
const canvas=document.getElementById('fire'),ctx=canvas.getContext('2d',{alpha:false});
const W=canvas.width,H=canvas.height,heat=new Uint8Array(W*H);
const colors=['#030303','#100504','#210704','#330904','#470b03','#5b0e03','#701202','#861803','#9b2004','#b12a05','#c73505','#d94305','#ec5105','#fa6108','#ff710b','#ff8010','#ff9017','#ffa020','#ffb02b','#ffbf3b','#ffcd50','#ffda69','#ffe583','#ffed9f','#fff5c5','#fffbe8','#ffffff'];
let t=0,last=0,acc=0;
function update(){
 const next=new Uint8Array(W*H);
 // A slow, continuous breathing cycle makes the whole flame rise and settle automatically.
 const breathe=.57+.43*(.5+.5*Math.sin(t*.018));
 const gust=.88+.12*Math.sin(t*.071);
 for(let x=0;x<W;x++){
  const tongues=Math.pow(Math.max(0,Math.sin(x*.12+t*.045)),5)*.17;
  const flicker=.78+Math.random()*.22;
  const base=Math.max(0,Math.min(1,(breathe*gust*flicker)+tongues));
  next[(H-1)*W+x]=Math.round(base*(colors.length-1));
  if(Math.random()<.035*breathe)next[(H-2)*W+x]=Math.round(base*(colors.length-1)*.9);
 }
 const heightWave=.68+.32*(.5+.5*Math.sin(t*.012));
 const ceiling=Math.floor(H*(1-heightWave));
 for(let y=0;y<H-1;y++)for(let x=0;x<W;x++){
  const source=(y+1)*W+x;
  const sway=Math.sin(t*.014+y*.08)*.7;
  const nx=Math.max(0,Math.min(W-1,x+(Math.random()<.5?-1:1)+(sway>0?1:0)));
  const fade=y<ceiling?(ceiling-y)/Math.max(1,ceiling):1;
  const decay=.45+Math.random()*1.25+fade*.65+(1-breathe)*.35;
  const value=Math.max(0,heat[source]-decay);
  const target=y*W+nx;
  if(value>next[target])next[target]=Math.round(value);
 }
 heat.set(next);t++;
}
function draw(){
 const image=ctx.createImageData(W,H),data=image.data;
 for(let i=0;i<heat.length;i++){
  const n=parseInt(colors[Math.min(colors.length-1,heat[i])].slice(1),16),j=i*4;
  data[j]=(n>>16)&255;data[j+1]=(n>>8)&255;data[j+2]=n&255;data[j+3]=255;
 }
 ctx.putImageData(image,0,0);
}
function loop(now){
 requestAnimationFrame(loop);
 if(!last)last=now;
 acc+=Math.min(100,now-last);last=now;
 while(acc>=30){update();acc-=30}
 draw();
}
for(let i=0;i<90;i++)update();
draw();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
