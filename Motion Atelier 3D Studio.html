function bridgeReply(id,result,error){if(bridgeSocket?.readyState===WebSocket.OPEN)bridgeSocket.send(JSON.stringify({type:'response',id,result,error:error||undefined}))}
async function bridgeCommand(method,args={}){
 const active=()=>clips[st.clip];
 if(method==='scene_summary'){
  return {character:rig?.vrm?.meta?.name||rig?.name||'Loaded model',hasCharacter:!!rig&&!rig.placeholder,placeholder:!!rig?.placeholder,vrm:!!vrm,rigged:!!rig&&!rig.generic&&!!Object.keys(rig.bones||{}).length,bones:Object.keys(rig?.bones||{}),clips:Object.keys(clips).filter(avail).length,activeClip:st.clip,timeSeconds:+st.t.toFixed(3),frame:Math.round(st.t*30),playing:st.play,fps:30};
 }
 if(method==='clips_list'){
  return Object.entries(clips).filter(([n])=>avail(n)).map(([name,c])=>({name,durationSeconds:c.dur,loop:!!c.loop,custom:!!c.custom,native:!!c.native,keyCount:Object.values(c.tracks||{}).reduce((a,k)=>a+k.length,0)}));
 }
 if(method==='clip_create'){
  const name=String(args.name||'').trim(),duration=Number(args.durationSeconds);
  if(!name||name.length>48)throw Error('Clip name must be 1–48 characters.');
  if(clips[name])throw Error('A clip with that name already exists.');
  if(!Number.isFinite(duration)||duration<.25||duration>60)throw Error('Duration must be between 0.25 and 60 seconds.');
  clips[name]={dur:duration,loop:args.loop!==false,custom:true,tracks:{}};
  play(name,true);sync();
  return {created:name,durationSeconds:duration,loop:clips[name].loop};
 }
 if(method==='pose_set'){
  if(!rig||rig.generic)throw Error('Load a rigged VRM character before creating pose keys.');
  if(args.clip&&args.clip!==st.clip){if(!clips[args.clip]||!avail(args.clip))throw Error('Clip not found or not editable.');play(args.clip,true)}
  const c=active();if(!c||c.native||c.static)throw Error('Select an editable clip first.');
  const frame=Number(args.frame);if(!Number.isInteger(frame)||frame<0||frame>1800)throw Error('Frame must be an integer from 0 to 1800.');
  st.play=false;st.t=frame/30;
  const updated=[];
  for(const item of args.keys||[]){
   const bone=String(item.bone||'');
   if(!ALL.includes(bone))throw Error('Unsupported control: '+bone);const rigBone=bone==='root'?'hips':bone;if(!rig.bones?.[rigBone])throw Error('This character has no keyable '+bone+' control.');
   if(bone==='root'&&!Array.isArray(item.positionM))throw Error('The root control requires positionM [x,y,z].');
   if(bone!=='root'&&!Array.isArray(item.rotationDeg))throw Error(bone+' requires rotationDeg [x,y,z].');
   const value=bone==='root'?item.positionM.map(Number):item.rotationDeg.map(v=>Number(v)*Math.PI/180);
   if(value.length!==3||value.some(v=>!Number.isFinite(v)||Math.abs(v)>1000))throw Error('Invalid three-axis value for '+bone+'.');
   const track=c.tracks[bone]??(c.tracks[bone]=[]);
   let key=track.find(k=>Math.abs(k.t-st.t)<1/60);
   if(!key){key={t:st.t,v:value,e:item.easing||'smooth'};track.push(key);track.sort((a,b)=>a.t-b.t)}
   else{key.v=value;key.e=item.easing||key.e||'smooth'}
   updated.push({bone,frame,t:st.t,value});
  }
  cur=sample(c,st.t);apply(cur);draw();sync();
  return {clip:st.clip,frame,updated};
 }
 if(method==='keys_read'){
  const name=args.clip||st.clip,c=clips[name];if(!c)throw Error('Clip not found.');
  const names=args.bones||[];
  return {clip:name,tracks:Object.fromEntries(names.map(n=>[n,(c.tracks[n]||[]).map(k=>({frame:Math.round(k.t*30),seconds:+k.t.toFixed(4),value:k.v,easing:k.e||'smooth'}))]))};
 }
 if(method==='playback_control'){
  if(args.clip&&args.clip!==st.clip){if(!clips[args.clip]||!avail(args.clip))throw Error('Clip not found.');play(args.clip,true)}
  const c=active();if(!c)throw Error('No active clip.');
  if(args.action==='play'){if(!st.loop&&st.t>=c.dur)st.t=0;st.play=true}
  else if(args.action==='pause')st.play=false;
  else if(args.action==='stop'){st.play=false;st.t=0}
  else if(args.action==='seek'){
   const t=Number(args.seconds);if(!Number.isFinite(t)||t<0||t>c.dur)throw Error('Seek time is outside this clip.');
   st.play=false;st.t=t;if(st.act)st.act.time=t;else{cur=sample(c,t);apply(cur)}
  }else throw Error('Unknown playback action.');
  sync();draw();return {clip:st.clip,action:args.action,timeSeconds:+st.t.toFixed(3),playing:st.play};
 }
 if(method==='save_custom_clips'){
  const out={};for(const n in clips)if(clips[n].custom)out[n]=clips[n];
  localStorage.setItem('ma.c',JSON.stringify(out));
  $('#msg').textContent='Saved '+Object.keys(out).length+' custom clip(s) in this browser';
  return {saved:Object.keys(out).length,storage:'localStorage'};
 }
 throw Error('Unsupported bridge command: '+method);
}
$('#ma-ai-connect').onclick=()=>{
 if(bridgeSocket&&bridgeSocket.readyState===WebSocket.OPEN){bridgeSocket.close(1000,'User disconnected');return}
 $('#ma-ai-help').textContent='Connecting to the local MCP bridge…';
 try{bridgeSocket=new WebSocket('ws://127.0.0.1:47821/motion-atelier-bridge')}
 catch(e){$('#ma-ai-help').textContent='Could not open local connection. Start the bridge on this computer.';return}
 bridgeSocket.onopen=()=>{bridgeSocket.send(JSON.stringify({type:'hello',app:'Motion Atelier'}));$('#ma-ai-connect').textContent='Disconnect';bridgeStatus('Connected · awaiting pairing')};
 bridgeSocket.onmessage=async event=>{
  let msg;try{msg=JSON.parse(event.data)}catch{return}
  if(msg.type==='bridge_info'){bridgeCode=msg.code;$('#ma-ai-code').textContent=bridgeCode;$('#ma-ai-help').textContent='Local server found. Give this code to your MCP client, then approve its request.'}
  if(msg.type==='bridge_ready')bridgeStatus('Connected · not paired');
  if(msg.type==='pair_request'){
   const approved=window.confirm('Allow an AI agent to access Motion Atelier?\\n\\nClient: '+(msg.client||'MCP agent')+'\\nPermissions: read scene and clips; create clips; edit pose keyframes; control playback; save custom clips.\\n\\nOnly approve if you started this connection.');
   bridgePaired=approved;bridgeStatus(approved?'AI connected':'Connection denied');
   $('#ma-ai-help').textContent=approved?'AI agent connected. You can disconnect at any time.':'Connection was denied.';
   bridgeSocket.send(JSON.stringify({type:'pair_result',id:msg.id,approved}));
  }
  if(msg.type==='command'){

   try{const result=await bridgeCommand(msg.method,msg.args||{});bridgeReply(msg.id,result)}
   catch(error){bridgeReply(msg.id,null,error.message||String(error))}
  }
 };
 bridgeSocket.onclose=()=>{bridgePaired=false;bridgeCode='';$('#ma-ai-code').textContent='------';$('#ma-ai-connect').textContent='Connect';bridgeStatus('Disconnected');$('#ma-ai-help').textContent='Bridge disconnected. Start the local server and connect again.'};

};
